syntax = "proto3";

package gh.common.v1;

option go_package = "pb/api/common/v1";


message FilterQuery {
  string account_id = 1;
  string organization_id = 2;
  int64 page = 3;
  int64 per = 4;
  string term = 5;
  string user_id = 6;
  string status = 7;
  string username = 8;
  string number = 9;
  string email = 10;
  string transaction_category = 11;
  string wallet_type = 12;
}

